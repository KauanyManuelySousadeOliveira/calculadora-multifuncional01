name: Automação da Calculadora

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

jobs:
  verificar-projeto:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código do projeto
        uses: actions/checkout@v4

      - name: Verificar arquivos principais
        run: |
          echo "Verificando estrutura da Calculadora Multifuncional..."
          test -f index.html
          test -f style.css
          test -f script.js
          test -f calculadora.test.js
          echo "Todos os arquivos principais foram encontrados!"

      - name: Configurar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar validadores (HTML, CSS e JS)
        run: |
          npm install -g htmlhint stylelint stylelint-config-standard eslint

      - name: Validar sintaxe do HTML
        run: htmlhint index.html

      - name: Validar sintaxe do JavaScript
        run: |
          node -c script.js
          echo "Sintaxe do JavaScript validada com sucesso!"

      - name: Executar testes matemáticos unitários
        run: node calculadora.test.js

      - name: Finalizar automação
        run: |
          echo "===================================="
          echo "Automação executada com sucesso!"
          echo "Calculadora Multifuncional V2.3.0"
          echo "===================================="
